[project]
name = "apicompat"
version = "0.1.0"
description = "Convert LLM API payloads between OpenAI Chat, OpenAI Responses and Anthropic Messages"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apicompat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
