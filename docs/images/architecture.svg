<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">llm-gateway request flow</title>
  <desc id="desc">A client speaking Anthropic Messages sends a request to llm-gateway, which converts it to OpenAI Responses for the upstream. The upstream response is converted back to Anthropic Messages for the client.</desc>

  <defs>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="gateway-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="960" height="360" fill="#ffffff"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- Client -->
    <rect x="40" y="120" width="190" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="135" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Client</text>
    <text x="135" y="182" text-anchor="middle" font-size="13" fill="#64748b">Claude Code · Codex</text>
    <text x="135" y="200" text-anchor="middle" font-size="13" fill="#64748b">Cherry Studio · …</text>

    <!-- Gateway -->
    <rect x="365" y="88" width="230" height="160" rx="12" fill="url(#gateway-bg)" stroke="#60a5fa" stroke-width="1.8"/>
    <text x="480" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">llm-gateway</text>
    <line x1="405" y1="140" x2="555" y2="140" stroke="#93c5fd" stroke-width="1"/>
    <text x="480" y="164" text-anchor="middle" font-size="13" fill="#1e40af">model routing</text>
    <text x="480" y="186" text-anchor="middle" font-size="13" fill="#1e40af">header pipeline</text>
    <text x="480" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">protocol conversion</text>
    <text x="480" y="228" text-anchor="middle" font-size="12" fill="#3b82f6">· statistics ·</text>

    <!-- Upstream -->
    <rect x="730" y="120" width="190" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="825" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Upstream</text>
    <text x="825" y="182" text-anchor="middle" font-size="13" fill="#64748b">DeepSeek · GPT · Claude</text>
    <text x="825" y="200" text-anchor="middle" font-size="13" fill="#64748b">Kimi · GLM · …</text>

    <!-- Request path (top): client -> gateway -> upstream -->
    <line x1="230" y1="146" x2="365" y2="146" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-right)"/>
    <text x="297" y="136" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">Anthropic</text>

    <line x1="595" y1="146" x2="730" y2="146" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-right)"/>
    <text x="662" y="136" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">Responses</text>

    <!-- Response path (bottom): upstream -> gateway -> client -->
    <line x1="730" y1="190" x2="595" y2="190" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-left)"/>
    <text x="662" y="208" text-anchor="middle" font-size="12" fill="#64748b">Responses</text>

    <line x1="365" y1="190" x2="230" y2="190" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-left)"/>
    <text x="297" y="208" text-anchor="middle" font-size="12" fill="#64748b">Anthropic</text>

    <!-- Legend -->
    <line x1="40" y1="292" x2="88" y2="292" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-right)"/>
    <text x="98" y="296" font-size="12.5" fill="#475569">request</text>

    <line x1="180" y1="292" x2="228" y2="292" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-left)"/>
    <text x="238" y="296" font-size="12.5" fill="#64748b">response (streamed)</text>

    <text x="40" y="330" font-size="12.5" fill="#94a3b8">
      The same client can talk to any upstream protocol — llm-gateway converts both directions.
    </text>
  </g>
</svg>
